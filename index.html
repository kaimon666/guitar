<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0714">
<title>🎸 Gitar Virtual</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --gold: #ffb347; --pink: #ff6ec7; --bg: #05030a; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% -10%, #2b1742 0%, #150b21 35%, var(--bg) 75%);
    color: #e8e0f0; min-height: 100vh; display: flex; justify-content: center;
    padding: 16px 14px 26px; overflow-x: hidden; user-select: none; -webkit-user-select: none;
  }
  body::before {
    content: ''; position: fixed; inset: -30%;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,120,50,.10), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(120,80,255,.12), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(80,200,255,.08), transparent 50%);
    pointer-events: none; z-index: 0; animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(3%,-3%) scale(1.08); } }
  .app { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 1; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 {
    font-size: 1.3rem; font-weight: 800; letter-spacing: .5px;
    background: linear-gradient(92deg, #ffd76e, #ff7a18 40%, #ff6ec7 70%, #7dd3fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,140,60,.35)); white-space: nowrap;
  }
  .display-wrap { display: flex; align-items: center; gap: 8px; }
  .chord-display {
    font-size: 1.45rem; font-weight: 800; padding: 6px 22px; border-radius: 14px;
    background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.12);
    min-width: 104px; text-align: center; color: var(--gold);
    text-shadow: 0 0 22px rgba(255,179,71,.7);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 6px 24px rgba(0,0,0,.4);
    backdrop-filter: blur(8px); transition: color .2s, border-color .2s, text-shadow .2s;
  }
  .chord-display.pop { animation: pop .3s cubic-bezier(.2,1.4,.5,1); }
  .chord-display.minor-mode {
    color: var(--pink); border-color: rgba(255,110,199,.5);
    text-shadow: 0 0 22px rgba(255,110,199,.8);
  }
  @keyframes pop { 0% { transform: scale(.82); } 55% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .neck {
    position: relative; height: 330px; border-radius: 20px;
    background: linear-gradient(180deg, #4a2c1a 0%, #2b160c 18%, #341d10 50%, #24110a 82%, #150a05 100%);
    border: 4px solid #5a3922;
    box-shadow: inset 0 0 90px rgba(0,0,0,.9), inset 0 2px 0 rgba(255,200,140,.14),
      0 22px 55px rgba(0,0,0,.65), 0 0 0 1px rgba(255,180,100,.12), 0 0 60px rgba(255,120,40,.07);
    overflow: hidden; display: flex; flex-direction: column; justify-content: space-evenly;
    padding: 16px 0; touch-action: manipulation;
  }
  .neck::before {
    content: ''; position: absolute; top: 16px; bottom: 16px; left: 40px; right: 14px;
    background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(16.667% - 2px),
      rgba(230,205,170,.30) calc(16.667% - 2px), rgba(230,205,170,.30) 16.667%);
    box-shadow: inset 0 0 40px rgba(0,0,0,.4); pointer-events: none;
  }
  .neck::after {
    content: ''; position: absolute; top: 10px; bottom: 10px; left: 38px; width: 3px;
    background: linear-gradient(180deg, #f4e3c8, #b99a6d); border-radius: 2px;
    box-shadow: 0 0 10px rgba(255,220,160,.35); pointer-events: none;
  }
  .string-row { position: relative; display: flex; align-items: center; padding: 0 14px 0 40px; height: 32px; cursor: pointer; z-index: 2; }
  .string-num { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: .68rem; font-weight: 800; color: rgba(255,225,180,.35); width: 16px; text-align: center; letter-spacing: .5px; }
  .string-line {
    position: relative; flex: 1; height: var(--t, 2px); border-radius: 99px;
    background: linear-gradient(180deg, #8f8f8f, #f5f5f5 35%, #c8c8c8 55%, #6b6b6b);
    box-shadow: 0 1px 3px rgba(0,0,0,.85), 0 0 5px rgba(255,255,255,.10); transform-origin: center;
  }
  .string-line.hit { animation: stringHit .5s cubic-bezier(.2,.85,.3,1);
    box-shadow: 0 0 20px 4px rgba(130,220,255,.9), 0 0 46px 10px rgba(120,200,255,.35); }
  @keyframes stringHit {
    0% { transform: scaleY(3.2); filter: brightness(2.6); }
    28% { transform: scaleY(2.1); filter: brightness(1.9); }
    58% { transform: scaleY(1.5); filter: brightness(1.4); }
    100% { transform: scaleY(1); filter: brightness(1); }
  }
  .fret-dot {
    position: absolute; top: 50%; left: 0; width: 15px; height: 15px; border-radius: 50%;
    transform: translate(-50%, -50%) scale(.4);
    background: radial-gradient(circle at 34% 32%, #fff0c4, #ffb347 45%, #c96a12);
    box-shadow: 0 0 12px rgba(255,180,70,.85), 0 0 4px rgba(0,0,0,.6);
    opacity: 0; transition: left .28s cubic-bezier(.3,1.3,.5,1), opacity .22s, transform .28s; pointer-events: none;
  }
  .fret-dot.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .fret-dot.minor-dot { background: radial-gradient(circle at 34% 32%, #ffd6f0, #ff6ec7 45%, #b0308a); box-shadow: 0 0 12px rgba(255,110,199,.9), 0 0 4px rgba(0,0,0,.6); }
  .controls { display: flex; gap: 10px; }
  .strum-btn {
    flex: 1; padding: 15px 12px; border-radius: 15px; border: none; font-family: inherit;
    font-size: .95rem; font-weight: 800; letter-spacing: 1.2px; cursor: pointer; color: #23100a;
    background: linear-gradient(135deg, #ffd76e, #ff9f1a 55%, #ff6b00);
    box-shadow: 0 7px 22px rgba(255,140,0,.35), inset 0 1px 0 rgba(255,255,255,.55);
    transition: transform .08s, box-shadow .2s, filter .2s;
    display: flex; align-items: center; justify-content: center; gap: 9px; touch-action: manipulation;
  }
  .strum-btn span { font-size: .6rem; font-weight: 700; opacity: .6; letter-spacing: 1.4px;
    padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,.18); }
  .strum-btn:active, .strum-btn.pressed {
    transform: translateY(2px) scale(.985);
    box-shadow: 0 2px 10px rgba(255,140,0,.5), inset 0 1px 0 rgba(255,255,255,.4);
    filter: brightness(1.12);
  }
  .strum-btn.up { flex: 0 0 33%; background: linear-gradient(135deg, #a5e4ff, #4a9ff5 55%, #2f6fd0); color: #04121f;
    box-shadow: 0 7px 22px rgba(80,160,255,.32), inset 0 1px 0 rgba(255,255,255,.55); }

  /* ---------- CHORD GRID ---------- */
  .chord-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
  .chord-btn {
    position: relative; padding: 12px 4px 22px; border-radius: 13px;
    border: 1px solid rgba(255,255,255,.11);
    background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.025));
    color: #efe6ff; font-size: .98rem; font-weight: 700; font-family: inherit; cursor: pointer;
    transition: transform .09s, box-shadow .22s, background .22s, color .22s, border-color .22s;
    backdrop-filter: blur(6px); touch-action: manipulation; overflow: hidden;
  }
  .chord-btn::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.25), transparent 45%);
    opacity: .5; pointer-events: none;
  }
  .chord-btn .k {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    font-size: .56rem; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
    color: rgba(255,255,255,.42); z-index: 1; white-space: nowrap;
  }
  .chord-btn.minor { color: #ffd6f0; }
  .chord-btn.minor .k { color: rgba(255,180,230,.55); }
  .chord-btn:hover { background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); border-color: rgba(255,255,255,.22); }
  .chord-btn.pressed {
    transform: scale(.93);
    background: linear-gradient(180deg, #ffd76e, #ff7a18);
    color: #23100a; border-color: #ffd76e;
    box-shadow: 0 0 28px rgba(255,150,50,.65), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .chord-btn.minor.pressed {
    background: linear-gradient(180deg, #ff9ce0, #ff4fb5);
    border-color: var(--pink);
    box-shadow: 0 0 28px rgba(255,110,199,.7), inset 0 1px 0 rgba(255,255,255,.6);
    color: #2a0719;
  }
  .chord-btn.pressed .k { color: rgba(0,0,0,.55); }
  .chord-btn.active {
    border-color: var(--gold); color: #ffd18a;
    box-shadow: inset 0 0 0 1px rgba(255,179,71,.7), 0 0 20px rgba(255,179,71,.3);
    background: linear-gradient(180deg, rgba(255,179,71,.18), rgba(255,179,71,.05));
  }
  .chord-btn.minor.active {
    border-color: var(--pink); color: #ffd6f0;
    box-shadow: inset 0 0 0 1px rgba(255,110,199,.7), 0 0 20px rgba(255,110,199,.35);
    background: linear-gradient(180deg, rgba(255,110,199,.18), rgba(255,110,199,.05));
  }
  /* Saat SHIFT ditahan, tombol minor menyala */
  body.shift-mode .chord-btn.minor {
    border-color: var(--pink);
    box-shadow: 0 0 22px rgba(255,110,199,.45), inset 0 0 0 1px rgba(255,110,199,.5);
    background: linear-gradient(180deg, rgba(255,110,199,.20), rgba(255,110,199,.06));
    color: #ffd6f0;
  }
  body.shift-mode .chord-btn.minor .k { color: rgba(255,220,240,.85); }

  .hint { font-size: .72rem; color: rgba(255,255,255,.42); text-align: center; line-height: 1.9; letter-spacing: .2px; }
  .hint b { color: var(--gold); font-weight: 700; background: rgba(255,179,71,.1);
    padding: 1px 6px; border-radius: 5px; border: 1px solid rgba(255,179,71,.18); }
  .hint b.pink { color: var(--pink); background: rgba(255,110,199,.1); border-color: rgba(255,110,199,.25); }

  @media (max-width: 560px) {
    body { padding: 12px 10px 22px; }
    h1 { font-size: 1rem; }
    .chord-display { font-size: 1.12rem; padding: 5px 15px; min-width: 82px; border-radius: 12px; }
    .neck { height: 258px; border-radius: 16px; padding: 12px 0; }
    .neck::before { top: 12px; bottom: 12px; left: 32px; right: 10px; }
    .neck::after { left: 30px; top: 8px; bottom: 8px; width: 2.5px; }
    .string-row { height: 26px; padding: 0 10px 0 32px; }
    .string-num { left: 8px; font-size: .6rem; width: 14px; }
    .fret-dot { width: 12px; height: 12px; }
    .chord-grid { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
    .chord-btn { font-size: .84rem; padding: 10px 2px 19px; border-radius: 11px; }
    .chord-btn .k { font-size: .5rem; bottom: 3px; letter-spacing: .3px; }
    .strum-btn { font-size: .82rem; padding: 13px 8px; border-radius: 13px; letter-spacing: .8px; }
    .strum-btn span { font-size: .53rem; padding: 2px 5px; }
    .hint { font-size: .63rem; line-height: 1.85; }
  }
  @media (max-width: 360px) {
    .chord-grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); }
    .neck { height: 226px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <h1>🎸 GITAR VIRTUAL</h1>
    <div class="display-wrap">
      <div class="chord-display" id="chordDisplay">—</div>
    </div>
  </div>

  <div class="neck" id="neck"></div>

  <div class="controls">
    <button class="strum-btn" id="strumDown" type="button">⬇ GENJRENG <span>↓ PANAH</span></button>
    <button class="strum-btn up" id="strumUp" type="button">⬆ UP <span>↑ PANAH</span></button>
  </div>

  <div class="chord-grid" id="chordGrid"></div>

  <p class="hint">
    <b>1–6</b> petik senar &nbsp;·&nbsp; <b>↓</b> genjreng bawah &nbsp;·&nbsp; <b>↑</b> genjreng atas<br>
    <b>A–G</b> kunci mayor &nbsp;·&nbsp; <b class="pink">⇧ + A–G</b> kunci minor &nbsp;·&nbsp; <b>ESC</b> reset
  </p>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const STRINGS = [
  { num: 6, freq: 82.41,  t: 4.2 },
  { num: 5, freq: 110.00, t: 3.6 },
  { num: 4, freq: 146.83, t: 3.0 },
  { num: 3, freq: 196.00, t: 2.4 },
  { num: 2, freq: 246.94, t: 1.8 },
  { num: 1, freq: 329.63, t: 1.3 }
];

// index 0 = senar 6 (paling tebal), index 5 = senar 1 (paling tipis)
// -1 = tidak dipetik
const CHORDS = {
  // MAYOR
  'A':  [-1, 0, 2, 2, 2, 0],
  'B':  [-1, 2, 4, 4, 4, 2],
  'C':  [-1, 3, 2, 0, 1, 0],
  'D':  [-1, -1, 0, 2, 3, 2],
  'E':  [0, 2, 2, 1, 0, 0],
  'F':  [1, 3, 3, 2, 1, 1],
  'G':  [3, 2, 0, 0, 0, 3],
  // MINOR
  'Am': [-1, 0, 2, 2, 1, 0],
  'Bm': [-1, 2, 4, 4, 3, 2],
  'Cm': [-1, 3, 5, 5, 4, 3],
  'Dm': [-1, -1, 0, 2, 3, 1],
  'Em': [0, 2, 2, 0, 0, 0],
  'Fm': [1, 3, 3, 1, 1, 1],
  'Gm': [3, 5, 5, 3, 3, 3]
};

// Pemetaan tombol huruf: a-g -> mayor, Shift + a-g -> minor
const CHORD_MAP = {
  'a': { major: 'A', minor: 'Am' },
  'b': { major: 'B', minor: 'Bm' },
  'c': { major: 'C', minor: 'Cm' },
  'd': { major: 'D', minor: 'Dm' },
  'e': { major: 'E', minor: 'Em' },
  'f': { major: 'F', minor: 'Fm' },
  'g': { major: 'G', minor: 'Gm' }
};

// Urutan tombol yang ditampilkan (mayor & minor bersebelahan)
const CHORD_BUTTONS = [
  { name: 'A',  key: 'A',  minor: false },
  { name: 'Am', key: '⇧A', minor: true  },
  { name: 'B',  key: 'B',  minor: false },
  { name: 'Bm', key: '⇧B', minor: true  },
  { name: 'C',  key: 'C',  minor: false },
  { name: 'Cm', key: '⇧C', minor: true  },
  { name: 'D',  key: 'D',  minor: false },
  { name: 'Dm', key: '⇧D', minor: true  },
  { name: 'E',  key: 'E',  minor: false },
  { name: 'Em', key: '⇧E', minor: true  },
  { name: 'F',  key: 'F',  minor: false },
  { name: 'Fm', key: '⇧F', minor: true  },
  { name: 'G',  key: 'G',  minor: false },
  { name: 'Gm', key: '⇧G', minor: true  }
];

/* =========================================================
   AUDIO ENGINE (Karplus–Strong)
   ========================================================= */
let audioCtx = null;
let masterGain = null;
const bufferCache = new Map();

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    setupBus();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function setupBus() {
  const ctx = audioCtx;
  masterGain = ctx.createGain();
  masterGain.gain.value = 0.95;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 24; comp.ratio.value = 5;
  comp.attack.value = 0.003; comp.release.value = 0.25;
  const dry = ctx.createGain(); dry.gain.value = 0.92;
  const conv = ctx.createConvolver();
  conv.buffer = makeIR(1.9, 2.7);
  const wet = ctx.createGain(); wet.gain.value = 0.30;
  masterGain.connect(comp);
  comp.connect(dry); dry.connect(ctx.destination);
  comp.connect(conv); conv.connect(wet); wet.connect(ctx.destination);
}

function makeIR(dur, decayPow) {
  const ctx = audioCtx, sr = ctx.sampleRate, len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decayPow);
    }
  }
  return buf;
}

function makePluckBuffer(freq, dur) {
  const ctx = audioCtx, sr = ctx.sampleRate, len = Math.floor(sr * dur);
  const N = Math.max(2, Math.round(sr / freq));
  const buf = ctx.createBuffer(1, len, sr);
  const out = buf.getChannelData(0);
  const delay = new Float32Array(N);
  let prev = 0;
  for (let i = 0; i < N; i++) {
    const n = Math.random() * 2 - 1;
    prev = prev * 0.55 + n * 0.45;
    delay[i] = prev;
  }
  const perPeriod = Math.pow(0.001, 1 / (freq * dur * 0.85));
  const loopF = Math.cos(Math.PI * freq / sr);
  let decay = perPeriod / loopF;
  if (decay > 0.99995) decay = 0.99995;
  if (decay < 0.90) decay = 0.90;
  let idx = 0;
  for (let i = 0; i < len; i++) {
    const cur = delay[idx];
    out[i] = cur;
    const nxt = delay[(idx + 1) % N];
    delay[idx] = (cur + nxt) * 0.5 * decay;
    idx = (idx + 1) % N;
  }
  return buf;
}

function getPluckBuffer(freq) {
  const key = Math.round(freq * 100);
  let b = bufferCache.get(key);
  if (b) return b;
  b = makePluckBuffer(freq, 3.0);
  if (bufferCache.size > 120) bufferCache.delete(bufferCache.keys().next().value);
  bufferCache.set(key, b);
  return b;
}

function pluck(freq, startTime, velocity) {
  ensureAudio();
  const ctx = audioCtx;
  velocity = velocity || 1;
  const t = (typeof startTime === 'number') ? startTime : ctx.currentTime + 0.01;
  const src = ctx.createBufferSource();
  src.buffer = getPluckBuffer(freq);
  const tone = ctx.createBiquadFilter();
  tone.type = 'lowpass';
  tone.frequency.value = Math.min(9500, freq * 15);
  tone.Q.value = 0.6;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.58 * velocity, t + 0.004);
  src.connect(tone); tone.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 3.05);
}

function playMuted() {
  ensureAudio();
  const ctx = audioCtx, t = ctx.currentTime;
  const len = Math.floor(ctx.sampleRate * 0.09);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = 950; f.Q.value = 1.1;
  const g = ctx.createGain(); g.gain.value = 0.22;
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t);
}

/* =========================================================
   STATE & UI
   ========================================================= */
let currentChord = null;
let shiftMode = false;
const stringEls = [];
const dotEls = [];
const chordBtns = {};
const neckEl = document.getElementById('neck');
const gridEl = document.getElementById('chordGrid');
const displayEl = document.getElementById('chordDisplay');

/* --- Bangun senar --- */
STRINGS.forEach((s, i) => {
  const row = document.createElement('div');
  row.className = 'string-row';
  row.dataset.idx = i;
  const num = document.createElement('span');
  num.className = 'string-num';
  num.textContent = s.num;
  const line = document.createElement('div');
  line.className = 'string-line';
  line.style.setProperty('--t', s.t + 'px');
  const dot = document.createElement('div');
  dot.className = 'fret-dot';
  line.appendChild(dot);
  row.appendChild(num);
  row.appendChild(line);
  neckEl.appendChild(row);
  stringEls.push(line);
  dotEls.push(dot);
  row.addEventListener('pointerdown', (e) => { e.preventDefault(); playString(i); }, { passive: false });
});

/* --- Bangun tombol akor (mayor + minor) --- */
CHORD_BUTTONS.forEach(({ name, key, minor }) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chord-btn' + (minor ? ' minor' : '');
  b.dataset.chord = name;
  b.innerHTML = name + '<span class="k">' + key + '</span>';

  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    b.classList.add('pressed');
    selectChord(name);
  }, { passive: false });

  const release = () => b.classList.remove('pressed');
  b.addEventListener('pointerup', release);
  b.addEventListener('pointerleave', release);
  b.addEventListener('pointercancel', release);
  b.addEventListener('contextmenu', e => e.preventDefault());

  gridEl.appendChild(b);
  chordBtns[name] = b;
});

/* --- Tombol genjreng --- */
const btnDown = document.getElementById('strumDown');
const btnUp = document.getElementById('strumUp');
btnDown.addEventListener('pointerdown', (e) => {
  e.preventDefault(); btnDown.classList.add('pressed'); strum('down');
}, { passive: false });
['pointerup','pointerleave','pointercancel'].forEach(ev =>
  btnDown.addEventListener(ev, () => btnDown.classList.remove('pressed')));
btnUp.addEventListener('pointerdown', (e) => {
  e.preventDefault(); btnUp.classList.add('pressed'); strum('up');
}, { passive: false });
['pointerup','pointerleave','pointercancel'].forEach(ev =>
  btnUp.addEventListener(ev, () => btnUp.classList.remove('pressed')));

/* =========================================================
   AKSI MUSIK
   ========================================================= */
function playString(i) {
  ensureAudio();
  const s = STRINGS[i];
  let fret = 0;
  if (currentChord) {
    fret = currentChord.frets[i];
    if (fret === -1) { playMuted(); animateString(i); return; }
  }
  const freq = s.freq * Math.pow(2, fret / 12);
  pluck(freq, null, 1);
  animateString(i);
}

function strum(dir) {
  ensureAudio();
  const order = dir === 'down' ? [0, 1, 2, 3, 4, 5] : [5, 4, 3, 2, 1, 0];
  const base = audioCtx.currentTime + 0.03;
  let offset = 0;
  for (const i of order) {
    const s = STRINGS[i];
    let fret = 0;
    if (currentChord) {
      fret = currentChord.frets[i];
      if (fret === -1) continue;
    }
    const freq = s.freq * Math.pow(2, fret / 12);
    pluck(freq, base + offset, 0.9);
    setTimeout(() => animateString(i), offset * 1000);
    offset += 0.028;
  }
}

function animateString(i) {
  const el = stringEls[i];
  if (!el) return;
  el.classList.remove('hit');
  void el.offsetWidth;
  el.classList.add('hit');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('hit'), 520);
}

function selectChord(name) {
  ensureAudio();
  const frets = CHORDS[name];
  if (!frets) return;

  currentChord = { name, frets };
  const isMinor = name.endsWith('m');

  displayEl.textContent = name;
  displayEl.classList.toggle('minor-mode', isMinor);
  displayEl.classList.remove('pop');
  void displayEl.offsetWidth;
  displayEl.classList.add('pop');

  Object.keys(chordBtns).forEach(n => chordBtns[n].classList.remove('active'));
  if (chordBtns[name]) chordBtns[name].classList.add('active');

  updateFretDots(isMinor);
  strum('down');
}

function clearChord() {
  currentChord = null;
  displayEl.textContent = '—';
  displayEl.classList.remove('minor-mode');
  Object.keys(chordBtns).forEach(n => chordBtns[n].classList.remove('active'));
  updateFretDots(false);
}

function updateFretDots(isMinor) {
  STRINGS.forEach((s, i) => {
    const dot = dotEls[i];
    dot.classList.toggle('minor-dot', !!isMinor);
    if (!currentChord) { dot.classList.remove('on'); return; }
    const fret = currentChord.frets[i];
    if (fret <= 0) { dot.classList.remove('on'); return; }
    dot.style.left = ((fret / 6) * 100) + '%';
    dot.classList.add('on');
  });
}

/* =========================================================
   KEYBOARD
   ========================================================= */
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;

  // Update indikator shift
  if (!shiftMode) { shiftMode = true; document.body.classList.add('shift-mode'); }

  // PANAH BAWAH = genjreng ke bawah
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    strum('down');
    return;
  }
  // PANAH ATAS = genjreng ke atas
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    strum('up');
    return;
  }

  // ANGKA 1-6 = petik senar
  if (e.key >= '1' && e.key <= '6') {
    e.preventDefault();
    playString(6 - parseInt(e.key, 10));
    return;
  }

  // ESC = reset
  if (e.key === 'Escape') {
    e.preventDefault();
    clearChord();
    return;
  }

  // HURUF A-G → mayor / Shift + A-G → minor
  const lower = e.key.toLowerCase();
  if (CHORD_MAP[lower]) {
    e.preventDefault();
    const target = e.shiftKey ? CHORD_MAP[lower].minor : CHORD_MAP[lower].major;
    selectChord(target);
  }
}, { passive: false });

window.addEventListener('keyup', (e) => {
  if (e.key === 'Shift' || e.key === 'ShiftLeft' || e.key === 'ShiftRight') {
    shiftMode = false;
    document.body.classList.remove('shift-mode');
  }
}, { passive: false });

// Kalau window kehilangan fokus, matikan shift-mode
window.addEventListener('blur', () => {
  shiftMode = false;
  document.body.classList.remove('shift-mode');
});

document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('.neck') || e.target.closest('.chord-btn') || e.target.closest('.strum-btn')) {
    e.preventDefault();
  }
});

['pointerdown', 'touchstart', 'keydown'].forEach(ev => {
  window.addEventListener(ev, () => ensureAudio(), { once: true, passive: true });
});
</script>
